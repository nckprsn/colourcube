<!doctype html>
<html lang="en-GB">
	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0">

		<title>Colour cube</title>
		<meta name="description" content="A visualisation of named CSS colours in common colour spaces, in a cube.">

		<style>

			/* -------------------------------------------------- */

			*, *::before, *::after { box-sizing: border-box; }

			body
			{
				margin: 0;

				font-size: clamp( 16px , 2.5svw , 22px );
				font-family: monospace;
				line-height: 1.5;

				color: white;
				background: #303030;
			}

			/* -------------------------------------------------- */

			.colourcube
			{
				width: 100svw;
				height: 100svh;

				overflow: hidden;

				--cube-size: 50svmin;

				/* Matches the initial rotation values set in the JS module */
				--cube-rotate-x: calc( var( --rotate-x , 0.05 ) * -360deg );
				--cube-rotate-y: calc( var( --rotate-y , -0.05 ) *  360deg );
				--cube-rotate-z: calc( var( --rotate-z , 0 ) *  360deg );

				--node-size: calc( var( --cube-size ) / 6 );

				--node-transition: transform 500ms cubic-bezier( 0 , 1 , 0.2 , 1 );

				--axis-size: 60svmin;

				--axis-width: 5px;
				--axis-label-size: 1.5em;
				--axis-arrow-size: 0.75em;
			}

			/* -------------------------------------------------- */

			.viewport
			{
				width: 100%;
				height: 100%;

				display: grid;
				place-items: center;

				perspective: 999px;

				transform-style: preserve-3d;

				/* Indicate that we don't want the browser to pinch-zoom, pan, etc on touch */
				touch-action: none;

				cursor: grab;
			}

			.colourcube.is_dragging .viewport
			{
				cursor: grabbing;
			}

			/* -------------------------------------------------- */

			.cube
			{
				pointer-events: none;

				width: var( --cube-size );
				height: var( --cube-size );

				position: relative;

				transform-style: preserve-3d;

				transform: /* Order matters! */
				           rotateZ( var( --cube-rotate-z ) )
				           rotateX( var( --cube-rotate-x ) )
				           rotateY( var( --cube-rotate-y ) );

				transition: var( --node-transition );
			}

			/* -------------------------------------------------- */

			.nodes
			{
				transform-style: preserve-3d;
			}

			.node
			{
				/* Default colourspace to RGB */
				--x-axis: calc( var( --rgb-r ) );
				--y-axis: calc( 1 - var( --rgb-g ) );
				--z-axis: calc( var( --rgb-b ) );

				pointer-events: none;

				background: var( --colour );

				width: var( --node-size );
				height: var( --node-size );
				border-radius: 50%;

				position: absolute;
				top: 0;
				left: 0;

				transform: /* Recentre the node */
				           translate( calc( var( --node-size ) * -0.5 ) , calc( var( --node-size ) * -0.5 ) )
				           /* Position maps RGB components to XYZ respectively */
				           translateX( calc( var( --x-axis ) * var( --cube-size ) ) )
				           translateY( calc( var( --y-axis ) * var( --cube-size ) ) )
				           translateZ( calc( ( var( --z-axis ) - 0.5 ) * var( --cube-size ) ) )
				           /* Rotate back to compensate for the container rotation */
				           /* (order must be the reverse of container's) */
				           rotateY( calc( var( --cube-rotate-y ) * -1 ) )
				           rotateX( calc( var( --cube-rotate-x ) * -1 ) )
				           rotateZ( calc( var( --cube-rotate-z ) * -1 ) );

				/* Sync with the container's transition */
				transition: var( --node-transition );
			}

			/* -------------------------------------------------- */

			.axes
			{
				position: absolute;
				inset: calc( ( var( --cube-size ) - var( --axis-size ) ) / 2 );

				transform-style: preserve-3d;
			}

			.axis
			{
				position: absolute;
				inset: 0;

				transform-style: preserve-3d;
			}

			.axis::before
			{
				content: '';

				position: absolute;
				inset: 0;

				width: var( --axis-arrow-size );
				height: var( --axis-arrow-size );

 				border-bottom: var( --axis-width ) solid;
				border-right: var( --axis-width ) solid;
			}

			.axis::after
			{
				content: '';

				position: absolute;
				inset: 0;

				width: var( --axis-label-size );
				height: var( --axis-label-size );

				display: grid;
				place-items: center;

				font-size: clamp( 1em , 5svw , 2em );
			}

			/* ---------- */

			.axis_x
			{
				border-bottom: var( --axis-width ) solid;
				transform: translatez( calc( var( --axis-size ) * -1/2 ) );
			}

			.axis_x::before
			{
				transform: translatex( calc( var( --axis-size ) + var( --axis-arrow-size ) * -1 ) )
				           translatey( calc( var( --axis-size ) + var( --axis-arrow-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           rotate( -45deg );
			}

			.axis_x::after
			{
				content: 'X';
				transform: translatey( calc( var( --axis-size ) + var( --axis-label-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           translatex( calc( var( --axis-size ) ) )
				           rotateY( calc( var( --cube-rotate-y ) * -1 ) )
				           rotateX( calc( var( --cube-rotate-x ) * -1 ) )
				           rotateZ( calc( var( --cube-rotate-z ) * -1 ) );
			}

			/* ---------- */

			.axis_y
			{
				border-left: var( --axis-width ) solid;
				transform:  translatez( calc( var( --axis-size ) * -1/2 ) );
			}

			.axis_y::before
			{
				transform: translatex( calc( var( --axis-arrow-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           rotate( -135deg );
			}

			.axis_y::after
			{
				content: 'Y';
				transform: translateY( calc( var( --axis-label-size ) * -1 ) )
				           translateX( calc( var( --axis-label-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           rotateY( calc( var( --cube-rotate-y ) * -1 ) )
				           rotateX( calc( var( --cube-rotate-x ) * -1 ) )
				           rotateZ( calc( var( --cube-rotate-z ) * -1 ) );
			}

			/* ---------- */

			.axis_z
			{
				border-bottom: var( --axis-width ) solid;
				transform: rotatey( 90deg ) translatez( calc( -1/2 * var( --axis-size ) ) );
			}

			.axis_z::before
			{
				transform: translatey( calc( var( --axis-size ) + var( --axis-arrow-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           rotate( 135deg );
			}

			.axis_z::after
			{
				content: 'Z';
				transform: translateY( calc( var( --axis-size ) + var( --axis-label-size ) * -1/2 + var( --axis-width ) * -1/2 ) )
				           translatex( calc( var( --axis-label-size ) * -1 ) ) 
				           rotatey( -90deg )
				           rotateY( calc( var( --cube-rotate-y ) * -1 ) )
				           rotateX( calc( var( --cube-rotate-x ) * -1 ) )
				           rotateZ( calc( var( --cube-rotate-z ) * -1 ) );
			}

			/* -------------------------------------------------- */

			.cube.rgb .node
			{
				--x-axis: calc( var( --rgb-r ) );
				--y-axis: calc( 1 - var( --rgb-g ) );
				--z-axis: calc( var( --rgb-b ) );
			}

			.cube.rgb .axis_x::after { content: 'R'; }
			.cube.rgb .axis_y::after { content: 'G'; }
			.cube.rgb .axis_z::after { content: 'B'; }

			/* ---------- */

			.cube.hsl .node
			{
				--x-axis: calc( var( --hsl-h ) );
				--y-axis: calc( 1 - var( --hsl-l ) );
				--z-axis: calc( var( --hsl-s ) );
			}

			.cube.hsl .axis_x::after { content: 'H'; }
			.cube.hsl .axis_y::after { content: 'L'; }
			.cube.hsl .axis_z::after { content: 'S'; }

			/* ---------- */

			.cube.hsv .node
			{
				--x-axis: calc( var( --hsv-h ) );
				--y-axis: calc( 1 - var( --hsv-v ) );
				--z-axis: calc( var( --hsv-s ) );
			}

			.cube.hsv .axis_x::after { content: 'H'; }
			.cube.hsv .axis_y::after { content: 'V'; }
			.cube.hsv .axis_z::after { content: 'S'; }

			/* ---------- */

			.cube.lab .node
			{
				--x-axis: calc( var( --lab-l ) );
				--y-axis: calc( 1 - var( --lab-a ) );
				--z-axis: calc( var( --lab-b ) );
			}

			.cube.lab .axis_x::after { content: 'L'; }
			.cube.lab .axis_y::after { content: 'A'; }
			.cube.lab .axis_z::after { content: 'B'; }

			/* ---------- */

			.cube.oklab .node
			{
				--x-axis: calc( var( --oklab-l ) );
				--y-axis: calc( 1 - var( --oklab-a ) );
				--z-axis: calc( var( --oklab-b ) );
			}

			.cube.oklab .axis_x::after { content: 'L'; }
			.cube.oklab .axis_y::after { content: 'A'; }
			.cube.oklab .axis_z::after { content: 'B'; }

			/* ---------- */

			.cube.lch .node
			{
				--x-axis: calc( var( --lch-l ) );
				--y-axis: calc( 1 - var( --lch-c ) );
				--z-axis: calc( var( --lch-h ) );
			}

			.cube.lch .axis_x::after { content: 'L'; }
			.cube.lch .axis_y::after { content: 'C'; }
			.cube.lch .axis_z::after { content: 'H'; }

			/* ---------- */

			.cube.oklch .node
			{
				--x-axis: calc( var( --oklch-l ) );
				--y-axis: calc( 1 - var( --oklch-c ) );
				--z-axis: calc( var( --oklch-h ) );
			}

			.cube.oklch .axis_x::after { content: 'L'; }
			.cube.oklch .axis_y::after { content: 'C'; }
			.cube.oklch .axis_z::after { content: 'H'; }

			/* -------------------------------------------------- */

			.ui
			{
				position: fixed;
				inset: 0; 

				display: grid;
				padding: 1em;
				gap: 1em;

				align-items: end;
				justify-content: end;

				pointer-events: none;
			}

			/* -------------------------------------------------- */

			.colourspace_selector
			{
				pointer-events: auto;
			}

			/* -------------------------------------------------- */

			select
			{
				line-height: inherit;
				font-family: inherit;
				font-size: inherit;
			}

			/* -------------------------------------------------- */

		</style>

	</head>

							<option value='lch'>LCH</option>
							<option value='oklch'>OKLCH</option>
						</select>
					</label>
				</div>
			</div>

		</div>

		<script>

			// --------------------------------------------------

			const DRAG_TO_ROTATE = function( $container , $viewport )
			{
				this.$container = $container;
				this.$viewport = $viewport;

				this.timer = null;

				this.is_dragging = false;

				/* Initial rotation matches CSS var() fallbacks */
				this.rotate_x = 0.05;
				this.rotate_y = -0.05;
				this.rotate_z = 0;

				this.previous_pointer_x = 0;
				this.previous_pointer_y = 0;

				// Bind up our event handler(s) to this instance
				this.start_drag = this.start_drag.bind( this );
				this.end_drag = this.end_drag.bind( this );
				this.on_drag = this.on_drag.bind( this );

				// Add mouse/pointer event listeners

				this.$viewport.addEventListener( 'pointerdown' , this.start_drag );
				this.$viewport.addEventListener( 'pointerup' , this.end_drag );

				this.$viewport.addEventListener( 'pointerleave' , this.end_drag );
				this.$viewport.addEventListener( 'pointercancel' , this.end_drag );

				this.$viewport.addEventListener( 'pointermove' , this.on_drag );
			}

			// --------------------------------------------------

			DRAG_TO_ROTATE.prototype.start_drag = function( event )
			{
				event.preventDefault();

				this.is_dragging = true;
				this.$container.classList.add( 'is_dragging' );

				/* Remember where we started dragging from */
 				const viewport_rect = event.currentTarget.getBoundingClientRect();
				this.previous_pointer_x = Math.floor( event.clientX - viewport_rect.left );
				this.previous_pointer_y = Math.floor( event.clientY - viewport_rect.top );
			}

			// --------------------------------------------------

			DRAG_TO_ROTATE.prototype.on_drag = function( event )
			{
				if( !this.is_dragging ) return;

				event.preventDefault();

 				const viewport_rect = event.currentTarget.getBoundingClientRect();
				const pointer_x = Math.floor( event.clientX - viewport_rect.left );
				const pointer_y = Math.floor( event.clientY - viewport_rect.top );

				const delta_x = pointer_y - this.previous_pointer_y;
				const delta_y = pointer_x - this.previous_pointer_x;

				this.previous_pointer_x = pointer_x;
				this.previous_pointer_y = pointer_y;

				// ----------

					this.rotate_x += delta_x * 0.0015;
					this.rotate_y += delta_y * 0.0015;
					this.rotate_z = 0;

				// ----------

					// const rotation = this.apply_rotations(
					// 	this.rotate_x * 2 * Math.PI,
					// 	this.rotate_y * 2 * Math.PI,
					// 	this.rotate_z * 2 * Math.PI,
					// 	delta_x * 0.0015 * 2 * Math.PI,
					// 	delta_y * 0.0015 * 2 * Math.PI 
					// );

					// this.rotate_x = rotation.x / ( 2 * Math.PI ),
					// this.rotate_y = rotation.y / ( 2 * Math.PI ),
					// this.rotate_z = rotation.z / ( 2 * Math.PI ),

				// ----------

				this.$container.style.setProperty( '--rotate-x' , ( Math.round( this.rotate_x * 10000 ) / 10000 ) );
				this.$container.style.setProperty( '--rotate-y' , ( Math.round( this.rotate_y * 10000 ) / 10000 ) );
				this.$container.style.setProperty( '--rotate-z' , ( Math.round( this.rotate_z * 10000 ) / 10000 ) );
			}

			// --------------------------------------------------

			DRAG_TO_ROTATE.prototype.end_drag = function( event )
			{
				event.preventDefault();

				this.is_dragging = false;
				this.$container.classList.remove( 'is_dragging' );
			}

			// --------------------------------------------------

			// DRAG_TO_ROTATE.prototype.apply_rotations = function( x1 , y1 , z1 , x2 , y2 )
			// {
			// 	return {
			// 		x: x1,
			// 		y: y1,
			// 		z: z1,
			// 	};
			// }

			// --------------------------------------------------

			const COLOURSPACE_SELECTOR = function( $container , $target )
			{
				this.$container = $container;
				this.$target = $target;

				this.$select = $container.querySelector( 'select' );

				this.colourspace = this.$select.value;

				// Bind up our event handler(s) to this instance
				this.on_change = this.on_change.bind( this );

				// Listen out for changes
				this.$select.addEventListener( 'change' , this.on_change );

				// Set the initial value
				this.on_change();
			}

			// --------------------------------------------------

			COLOURSPACE_SELECTOR.prototype.on_change = function()
			{
				this.$target.classList.remove( this.colourspace );
				this.colourspace = this.$select.value;
				this.$target.classList.add( this.colourspace );
			}

			// --------------------------------------------------

			new DRAG_TO_ROTATE( document.querySelector( '.colourcube' ) , document.querySelector( '.viewport' ) );

			new COLOURSPACE_SELECTOR( document.querySelector( '.colourspace_selector' ) , document.querySelector( '.cube' ) );

			// --------------------------------------------------

		</script>

	</body>
</html>
